<svg xmlns="http://www.w3.org/2000/svg" width="160" height="46" viewBox="0 0 160 46" role="img" aria-label="GitHub" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif'><style>@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes sweep{to{stroke-dashoffset:-100}}.u{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}.g{animation:sweep 8s linear infinite}@media (prefers-reduced-motion:reduce){.u{opacity:1;animation:none}.g{animation:none}}</style><title>GitHub</title><rect x=".5" y=".5" width="159" height="45" rx="23.0" fill="#F5F5F7" stroke="#F5F5F7"/><text x="80.0" y="28.5" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="middle">GitHub</text></svg>